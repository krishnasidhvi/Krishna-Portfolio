<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to Portfolio...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect fallback
      window.location.replace(window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1));
    </script>
  </head>
  <body style="background-color: #020617; color: #38bdf8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #ffffff;">Loading Portfolio...</h2>
      <p style="color: #94a3b8;">If you are not redirected automatically, <a href="./" style="color: #38bdf8;">click here</a>.</p>
    </div>
  </body>
</html>
